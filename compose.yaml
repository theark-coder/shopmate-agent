services:
  db:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_USER: shopmate
      POSTGRES_DB: shopmate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopmate -d shopmate"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  init:
    build: .
    command: ["python", "-m", "deploy.bootstrap_day24"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: shopmate
      PGDATABASE: shopmate
      PGPASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg_data:
  hf_cache:
