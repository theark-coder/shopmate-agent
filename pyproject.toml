[project]
name = "shopmate-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "lixr1881@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "openai>=3.26.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shopmate-agent = "shopmate_agent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
