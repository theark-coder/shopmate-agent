[project]
name = "shopmate-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "lixr1881@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "jieba>=0.42.1",
    "langgraph>=1.2.15",
    "numpy>=2.5.3",
    "openai>=3.26.1",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.7.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shopmate-agent = "shopmate_agent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
