name: Offline key-path CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 and uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Check source artifacts (stdlib only)
        run: python3 scripts/check_day28_repo.py

      - name: Create minimal isolated test environment
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python -e . --no-deps
          uv pip install --python .venv/bin/python pytest fastapi httpx langgraph numpy "psycopg[binary]"

      - name: Seed synthetic SQLite data (no external APIs)
        run: .venv/bin/python scripts/seed_demo_data.py

      - name: Offline key-path tests (not full suite)
        run: |
          .venv/bin/python -m pytest -q \
            tests/test_chunking.py \
            tests/test_answer_quality.py \
            tests/test_shopmate_graph.py \
            tests/test_stream_api.py \
            tests/test_day25_release.py \
            tests/test_day26_perf.py \
            tests/test_day27_eval.py \
            tests/test_day28_open_source.py
