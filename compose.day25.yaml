# Use together with the existing compose.yaml from Day 24.
services:
  app:
    command: ["uvicorn", "shopmate_agent.public_demo:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: shopmate
      PGDATABASE: shopmate
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 40s

  proxy:
    image: caddy:2-alpine
    env_file:
      - .env.day25
    volumes:
      - ./deploy/Caddyfile.day25:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
